# SPDX-License-Identifier: MIT-0

# Gates in order, matching the platform's CI. No custom policy scripts.
#
# Runners are pinned to explicit GitHub-hosted images, so `runs-on` never
# resolves to a self-hosted runner. Actions are pinned to commit SHAs (the tag
# each one resolves to is named alongside it) because a tag is mutable: this
# crate is a dependency of a trading platform, so a silently retagged action is
# a supply-chain path into it. Dependabot keeps the pins fresh.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# One live run per ref. Pushing again to a PR supersedes the previous run, so
# cancel it; runs on `main` are kept, since each one is the record for a commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; no job here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the job token in .git/config for later steps to reuse.
          persist-credentials: false

      # This step only bootstraps rustup; the version is NOT pinned here on
      # purpose. rust-toolchain.toml is the single source of truth and rustup
      # honours it for every cargo invocation in the workspace, installing that
      # toolchain and its components on demand — the run log confirms it with
      # "the toolchain '1.97.1-...' is currently in use (overridden by
      # .../rust-toolchain.toml)". Naming a version here too would duplicate the
      # pin in a second file for no gain.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: cargo-nextest,cargo-deny

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: tests
        run: cargo nextest run --all-targets --no-fail-fast

      # nextest does not run doctests, and the Quick start example is one.
      - name: doctests
        run: cargo test --doc

      - name: docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

      - name: licenses & advisories
        run: cargo deny check

  msrv:
    name: msrv (${{ matrix.rust }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        rust: ["1.95"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The `toolchain` input overrides rust-toolchain.toml, so the
      # `rust-version` floor declared in Cargo.toml is actually exercised
      # rather than merely asserted.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv-${{ matrix.rust }}

      - name: check
        run: cargo +${{ matrix.rust }} check --all-targets
