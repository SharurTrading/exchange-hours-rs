# SPDX-License-Identifier: MIT-0

# Gates in order, matching the platform's CI. No custom policy scripts.
#
# Runners are pinned to explicit GitHub-hosted images, so `runs-on` never
# resolves to a self-hosted runner.
name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Toolchain comes from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: tests
        run: cargo nextest run --all-targets --no-fail-fast

      # nextest does not run doctests, and the Quick start example is one.
      - name: doctests
        run: cargo test --doc

      - name: docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

      - name: licenses & advisories
        run: cargo deny check

  msrv:
    name: msrv (${{ matrix.rust }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        rust: ["1.95"]
    steps:
      - uses: actions/checkout@v4

      # Overrides rust-toolchain.toml so the `rust-version` floor declared in
      # Cargo.toml is actually exercised rather than merely asserted.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ matrix.rust }}

      - name: check
        run: cargo +${{ matrix.rust }} check --all-targets
