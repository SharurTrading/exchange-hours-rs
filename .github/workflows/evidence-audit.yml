# SPDX-License-Identifier: MIT-0

# The evidence audit (issue #288): on every pull request that touches the
# evidence files, the Documents-digest fence runs non-vacuously against the
# public evidence repo, and `cargo xtask verify-evidence --all` re-verifies
# every `### Documents` row in every evidence file against the same checkout.
# "These bytes back these claims" becomes a green check on the pull request
# instead of a reviewer's local custom. The store's resolution is the fence's
# own logic: `$EXCHANGE_HOURS_RESEARCH` is set here explicitly, so the fence
# verifies; and if the checkout ever failed to produce a store, the fence's
# CI guard would fail loudly rather than pass silently.
#
# Runners are pinned to explicit GitHub-hosted images, so `runs-on` never
# resolves to a self-hosted runner. Actions are pinned to commit SHAs (the
# tag each one resolves to is named alongside it) because a tag is mutable:
# this crate is a dependency of a trading platform, so a silently retagged
# action is a supply-chain path into it. Dependabot keeps the pins fresh.
name: evidence-audit

on:
  pull_request:
    paths:
      - 'docs/evidence/**'

# One live run per ref; pushing again to a PR supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only; no step here writes to either repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The evidence store for the digest fence and the verifier: the public
  # repo, checked out in the second step below.
  EXCHANGE_HOURS_RESEARCH: ${{ github.workspace }}/exchange-hours-evidence

jobs:
  audit:
    name: digest fence + verify-evidence --all
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the job token in .git/config for later steps to reuse.
          persist-credentials: false

      # The evidence repo, beside the crate checkout: the store the fence and
      # the verifier resolve. Plain git — the whole pack, no LFS.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SharurTrading/exchange-hours-evidence
          path: exchange-hours-evidence
          persist-credentials: false

      # rust-toolchain.toml is the single source of truth; rustup honours it
      # for every cargo invocation below (see ci.yml for the reasoning).
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The fence itself, non-vacuous: every Documents row of every evidence
      # file must resolve to bytes this checkout holds.
      - name: documents-digest fence
        run: cargo test --test schedule_documentation every_documents_digest_is_the_research_store_bytes

      # The same chain through the verifier, covering every row and printing
      # what it verified, so the row counts land in the run log.
      - name: verify-evidence --all
        run: cargo xtask verify-evidence --all
