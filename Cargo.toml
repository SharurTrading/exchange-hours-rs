# SPDX-License-Identifier: MIT-0

[package]
name = "exchange-hours"
version = "1.4.0"
edition = "2024"
# Deliberately conservative: the language floor is 1.88 (the `let`-chains this
# crate uses) but 1.95 is what consumers are expected to be on. Verified by the
# `msrv` CI job, which builds on exactly this version.
rust-version = "1.95"
license = "MIT-0"
description = "Exchange trading hours, session boundaries, and calendar-aware bar boundaries. UTC in, UTC out."
repository = "https://github.com/SharurTrading/exchange-hours-rs"
documentation = "https://docs.rs/exchange-hours"
readme = "README.md"
keywords = ["exchange", "trading", "market-hours", "calendar", "finance"]
categories = ["date-and-time", "finance"]
# Packaged crates carry the library, its evidence, and the maintenance laws
# linked by those documents. CI config, lint/dependency policy, and the
# toolchain pin are repository concerns that a consumer never reads.
# `rust-toolchain.toml` in particular would only confuse—it governs this
# repo's own builds, not a dependent's. The `tools/` scripts are one-off
# research and encode helpers from the evidence waves, likewise never a
# consumer's concern.
exclude = [
    ".coderabbit.yaml",
    ".github/",
    "rust-toolchain.toml",
    "clippy.toml",
    "deny.toml",
    "docs/plans/",
    "tools/",
]

[lib]
name = "exchange_hours"

[features]
# Parse caller-supplied TZif bytes. Network and filesystem access belong to
# the optional exchange-hours-tzdb companion.
runtime-tzdb = ["jiff/alloc"]

# Gates, in the same shape the consuming platform uses. CI promotes every
# warning to an error with `-D warnings`, so `warn` here means "fails CI".
[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# LAW-PANIC — the public surface is total; nothing here may panic. Tests are
# exempt via the `allow-*-in-tests` switches in clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unreachable = "deny"
# STYLE-LOG — a library emits no output. This crate is pure computation, so
# there is nothing to report that is not already in a return value; it carries
# no logging facade at all.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
# LAW-DETERMINISM — enforced by the disallowed lists in clippy.toml.
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"

[dependencies]
# Compile the built-in zones into the binary without host lookup or wall time.
jiff = { version = "=1.0.3", default-features = false, features = ["static", "tz-fat", "perf-inline"] }
serde = { version = "1.0.229", features = ["derive"] }

[build-dependencies]
# jiff-static obtains its embedded IANA data from this package. Pin it even
# when a consuming application resolves dependencies without our lockfile.
jiff-tzdb = { workspace = true }

[dev-dependencies]
jiff-tzdb = { workspace = true }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# Test-only: the Documents digest fence recomputes each artifact's sha256 from
# the research store's bytes. Never linked into the library, so
# LAW-DETERMINISM is untouched.
sha2 = "0.11.0"
serde_json = "1.0.151"
serde_test = "1.0.177"

[[bench]]
name = "calendar_queries"
harness = false

# Subdirectory test files are not auto-discovered, so targets are declared explicitly.
[[test]]
name = "session_invariants"
path = "tests/contract/session_invariants.rs"

[workspace]
members = ["xtask", "tzdb-runtime"]

[workspace.dependencies]
exchange-hours = { path = ".", version = "1.4.0" }
jiff-tzdb = "=1.0.0"
