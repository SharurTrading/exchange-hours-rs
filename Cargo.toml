[package]
name = "exchange-hours"
version = "0.1.0"
edition = "2024"
publish = false
description = "Exchange trading hours, session-boundary, and candle-boundary contracts."

[lib]
name = "exchange_hours"

[dependencies]
chrono = { version = "0.4.42", features = ["clock", "serde"] }
chrono-tz = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1.0.145"

# Subdirectory test files are not auto-discovered, so targets are declared explicitly.
[[test]]
name = "session_invariants"
path = "tests/contract/session_invariants.rs"
