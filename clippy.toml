# SPDX-License-Identifier: MIT-0

# `msrv` is deliberately not set here: clippy reads it from `rust-version` in
# Cargo.toml (1.95), so the two cannot drift.
avoid-breaking-exported-api = false

# LAW-PANIC: tests and benches are exempt from the panic-family lints. A
# benchmark is a measurement harness, not library code: it may abort on an
# unexpected state rather than propagate it, exactly as a test may.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
# STYLE-LOG: the library emits no output; tests may print.
allow-print-in-tests = true
allow-dbg-in-tests = true

# Stage 2B (#115) migrated every identity-backed date-aware query to
# `Result<_, CalendarQueryError>`. Each converted call site in a test carries an
# `.expect("...")` that rustfmt wraps onto its own line, so a long cross-product
# fence — one that already swept many instants, kinds and resolutions — grew by
# roughly half again. The alternative is seventeen per-function
# `#[expect(clippy::too_many_lines, reason = "...")]` attributes whose only
# content is "this fence got longer when the API did", which is noise on exactly
# the fences a reader most needs to read.
#
# The value is the smallest round number that admits every affected fence at
# this revision (the longest is 145 counted lines). It stays well below the
# 500-line source-reviewability guard for production modules, so the structural
# rule in AGENTS.md is untouched: this loosens the pedantic *lint* for test
# functions, not the reviewability budget for `src/`.
#
# STAGE 2 DEBT, not a permanent policy. Seventeen converted fences sit between
# 100 and 145 counted lines, and the alternative was seventeen per-function
# `#[expect]`s whose only content is the sentence above. Revert this to clippy's
# default once the longest fences are split into per-subject helpers, so a future
# 150-line test function fails the lint again rather than passing silently.
too-many-lines-threshold = 160

# LAW-DETERMINISM — Jiff's system clock and host database features are off.
# Guard these APIs even when a consumer unifies in additional features.
disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "LAW-DETERMINISM: the caller supplies the instant" },
    { path = "std::time::Instant::now", reason = "LAW-DETERMINISM: the caller supplies the instant" },
    { path = "jiff::Timestamp::now", reason = "LAW-DETERMINISM: the caller supplies the instant", allow-invalid = true },
    { path = "jiff::ZonedDateTime::now", reason = "LAW-DETERMINISM: the caller supplies the instant", allow-invalid = true },
    { path = "jiff::tz::TimeZone::system", reason = "LAW-DETERMINISM: use a compiled-in IANA zone", allow-invalid = true },
    { path = "jiff::tz::TimeZone::get", reason = "LAW-DETERMINISM: use the compile-time tz::get! macro" },
    { path = "jiff::tz::db", reason = "LAW-DETERMINISM: no ambient time zone database" },
    { path = "jiff::tz::TimeZoneDatabase::from_env", reason = "LAW-DETERMINISM: no ambient time zone database", allow-invalid = true },
    { path = "jiff::tz::TimeZoneDatabase::from_dir", reason = "LAW-DETERMINISM: no filesystem lookup", allow-invalid = true },
    { path = "jiff::tz::TimeZoneDatabase::from_concatenated_path", reason = "LAW-DETERMINISM: no filesystem lookup", allow-invalid = true },
]

disallowed-types = []
disallowed-macros = []
