# SPDX-License-Identifier: MIT-0

# `msrv` is deliberately not set here: clippy reads it from `rust-version` in
# Cargo.toml (1.95), so the two cannot drift.
avoid-breaking-exported-api = false

# LAW-PANIC: tests and benches are exempt from the panic-family lints. A
# benchmark is a measurement harness, not library code: it may abort on an
# unexpected state rather than propagate it, exactly as a test may.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
# STYLE-LOG: the library emits no output; tests may print.
allow-print-in-tests = true
allow-dbg-in-tests = true

# Stage 2B (#115) migrated every identity-backed date-aware query to
# `Result<_, CalendarQueryError>`. Each converted call site in a test carries an
# `.expect("...")` that rustfmt wraps onto its own line, so a long cross-product
# fence — one that already swept many instants, kinds and resolutions — grew by
# roughly half again. The alternative is seventeen per-function
# `#[expect(clippy::too_many_lines, reason = "...")]` attributes whose only
# content is "this fence got longer when the API did", which is noise on exactly
# the fences a reader most needs to read.
#
# The value is the smallest round number that admits every affected fence at
# this revision (the longest is 145 counted lines). It stays well below the
# 500-line source-reviewability guard for production modules, so the structural
# rule in AGENTS.md is untouched: this loosens the pedantic *lint* for test
# functions, not the reviewability budget for `src/`.
too-many-lines-threshold = 160

# LAW-DETERMINISM — this crate never reads a clock. `chrono`'s `clock` feature
# is off, so `Utc::now` does not exist to call; the entries below are the guard
# that makes re-enabling it a lint failure rather than a silent regression.
disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "LAW-DETERMINISM: the caller supplies the instant" },
    { path = "std::time::Instant::now", reason = "LAW-DETERMINISM: the caller supplies the instant" },
    { path = "chrono::Utc::now", reason = "LAW-DETERMINISM: the caller supplies the instant", allow-invalid = true },
    { path = "chrono::Local::now", reason = "LAW-DETERMINISM / UTC-only: no clock, no local time", allow-invalid = true },
]

disallowed-types = []
disallowed-macros = []
