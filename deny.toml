# SPDX-License-Identifier: MIT-0

# This file IS the dependency-license policy. cargo-deny has no deny-list, so
# the allow-list below is exhaustive: anything not named here — GPL/LGPL/AGPL
# included — fails the gate.

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0", # unicode-ident (proc-macro2 tree) is "(MIT OR Apache-2.0) AND Unicode-3.0"
    "CC0-1.0",
]

[bans]
wildcards = "deny"
multiple-versions = "warn"

[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # Both advisories are "unmaintained upstream, no safe upgrade available"
    # findings recorded in #403 (PROC-DEP-DECIDE): chrono and chrono-tz are
    # this crate's clock and IANA-zone machinery, so an upgrade lands only as
    # the operator's decision on that issue. These entries expire and must be
    # re-reviewed against #403 on 2027-01-18.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; no safe upgrade; tracked as #403" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained; no safe upgrade; tracked as #403" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
