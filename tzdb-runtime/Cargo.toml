# SPDX-License-Identifier: MIT-0

[package]
name = "exchange-hours-tzdb"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT-0"
description = "Automatic IANA time zone release updates for exchange-hours."
repository = "https://github.com/SharurTrading/exchange-hours-rs"
readme = "README.md"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unreachable = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"

[dependencies]
exchange-hours = { workspace = true, features = ["runtime-tzdb"] }
flate2 = "1.1.9"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"

[dev-dependencies]
jiff-tzdb = { workspace = true }
